# Site settings. Jekyll does not reload this file during `jekyll serve`;
# restart the server after editing it.

locale                   : "en-US"
title                    : "Gonçalo Lima"
description              : "Gonçalo Lima is an applied economist and Postdoctoral Researcher at the University of Copenhagen, working on labor economics, health economics, and the economics of education."
url                      : "https://www.goncalolima.com"
baseurl                  : ""
repository               : "glima93/glima93.github.io"
timezone                 : Europe/Copenhagen

# Shown in the profile column on the Home page and in the footer
author:
  name           : "Gonçalo Lima"
  avatar         : "profile.png"        # file in /images/
  position       : "Postdoctoral Researcher"
  affiliation:                          # one line each, under the position
    - "Department of Economics"
    - "University of Copenhagen"
  location       : "Copenhagen, DK"
  email          : "goncalo.lima@econ.ku.dk"
  googlescholar  : "https://scholar.google.com/citations?user=7u9FU8MAAAAJ&hl=pt-PT"
  github         : "glima93"
  twitter        : "gncl_lm"

# Content
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .claude
encoding: "utf-8"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
