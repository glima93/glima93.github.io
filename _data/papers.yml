- title: "Physician Working Time Restrictions and Patient Mortality"
  link: "/assets/papers/Physician_Working_Time_Restrictions_Lima_Lorentzen.pdf"
  authors:
    - "Kathrine Lorentzen"
  status: "Working paper"
  summary: "Capping doctors' overtime, night, and weekend work in 1980s Denmark led wards to hire more physicians and lowered patient mortality."
  abstract: "We study how shortening physicians' work schedules affects healthcare provision and patient mortality. We exploit a 1982 reform in Denmark that strongly restricted hospital doctors' overtime, weekend, and nighttime shifts. Consistent with substitution from hours to workers, vacancies increased by 35% one-year after implementation. Using a dose-response difference-in-differences strategy, we leverage variation in the timing and intensity of the policy across hospital wards with different pre-reform reliance on overtime to document three main results. First, wards where labor demand changed the most substantially decreased in-hospital mortality rates, especially among emergency admissions. Second, while more physicians led to more admissions, better mortality outcomes are not explained by shifts in patient composition. Third, persistent post-discharge mortality declines and no change in readmissions or duration of stays suggest that gains were not at the expense of higher patient turnover. Our findings are consistent with overtime regulations correcting inefficiently long work hours in a frictional labor market."
  presentations:
    - "EALE 2026 (September 2026)"
    - "Royal Holloway Health and Human Capital Workshop (May 2026)"
    - "QMUL Economics and Finance PhD Workshop (May 2026)"
    - "Bolzano Applied Microeconomics Workshop (March 2026)"
    - "23rd Brucchi Luchino Labor Economics Workshop (December 2025)"
    - "Bologna Health Economics and Public Policy Evaluation (April 2025)"
  links:
    - label: "PDF"
      url: "/assets/papers/Physician_Working_Time_Restrictions_Lima_Lorentzen.pdf"

- title: "Parental Education Spillovers and Student Performance: Evidence from Siblings"
  link: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5489366"
  authors:
    - "Miguel Nunes"
  status: "Submitted"
  status_style: "sub"
  summary: "Exposure to classmates with college-educated parents closes about a fifth of the grade-repetition gap for children of less-educated parents."
  abstract: "We study the effect of exposure to peers with college-educated parents on the school outcomes of children from less educated households. For identification, we exploit within-family-by-year variation to control for the significant non-random sorting of parents into schools, and time-varying shocks to the family environment. We use a rich administrative data from Portugal, a school system with some of the largest gaps in educational attainment by children's socioeconomic status among OECD countries. We find that moving a student from the 10th to the 90th percentile in the distribution of exposure to children with college-educated parents is equivalent to closing about a fifth of the gap in grade repetition by parental education. We show that the effect on grade repetition is partly driven by improved school performance, consistent with a social contagion type of mechanism. However, we also show suggestive evidence that schools fail fewer students who were eligible to repeat when faced with higher concentrations of students with college-educated parents."
  presentations:
    - "EALE 2024 (September 2024)"
    - "IWAEE 2024 (June 2024)"
    - "Junior Economists Meeting Milan (May 2024)"
    - "SOLE 2024 (May 2024)"
  links:
    - label: "SSRN"
      url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5489366"
