- title: "Grading Leniency and Educational Choices: Evidence from a Blind Grading Regime"
  status: "Draft on request"
  summary: "Lenient grading of anonymous national exams in Portugal in the end of middle school keeps low performers from repeating a grade and raises the likelihood of enrolling in an academic high school track."
  abstract: "How do positive signals of academic ability change educational choices and future performance? I study how receiving a higher grade on a national standardized test affects students’ outcomes. For identification, I exploit the random assignment of graders to anonymized tests at the end of middle school, using administrative data from Portugal. First, I show that there is substantial bunching just above passing thresholds, consistent with graders being lenient. I then use bunching methods to identify the effect of leniency on students’ choices. I find that low performers who benefit from lenient grading are significantly less likely to repeat the same school grade and more likely to enroll in a more demanding high-school track. Finally, although graders do not observe test takers’ characteristics, I show that leniency correlates with characteristics that can be indirectly inferred from the test itself."
  presentations:
    - "Lisbon Economics and Statistics of Education (January 2024)"
    - "EUI Microeconometrics Working Group (March 2023)"

