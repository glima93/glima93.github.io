- title: "Reproducibility and Robustness of Economics and Political Science Research"
  link: "https://www.nature.com/articles/s41586-026-10251-x"
  authors:
    - "Abel Brodeur, Derek Mikola, Nikolai Cook et al."
  status: "Nature 2026"
  status_style: "pub"
  journal: "Nature"
  volume: "652"
  pages: "151–156"
  year: "2026"
  summary: "A large, multi-team effort to reproduce and stress-test published research in economics and political science."
  abstract: "This systematic and large-scale reproduction effort tests the reproducibility and robustness of economics and political science, contributing to a growing literature on research credibility and self-correction in science. We reproduced original analyses and conducted robustness checks of 110 articles recently published in leading economics and political science journals, all of which have mandatory data and code sharing policies. We found that over 85% of published claims were computationally reproducible. In robustness checks, our re-analyses led to 72% of statistically significant estimates to remain significant and in the same direction, and the median reproduced effect size is (nearly) the same as the originally published effect size (that is, 99% of the published effect size). Additionally, six independent research teams examined 12 pre-specified hypotheses about determinants of robustness. Research teams with more experience found lower levels of robustness, and robustness correlated with neither author characteristics nor data availability."
  links:
